<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>التوصيل بنفسي</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101419;font-family:Tahoma,Arial,sans-serif;color:#fff}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#20252a}
.hud{position:fixed;z-index:5;top:10px;left:10px;right:10px;display:flex;gap:8px;justify-content:space-between;pointer-events:none}
.panel{background:rgba(9,17,25,.88);border:1px solid rgba(255,190,40,.65);border-radius:14px;padding:8px 12px;box-shadow:0 5px 20px #0008;backdrop-filter:blur(5px)}
.player{min-width:185px}.title{font-size:18px;font-weight:800}.money{color:#45e08a;font-size:16px;font-weight:700}
.order{min-width:245px;text-align:center}.order b{color:#ffd23f}.small{font-size:12px;opacity:.82}
.speed{min-width:100px;text-align:center}.speed b{font-size:24px;color:#ffd23f}
.controls{position:fixed;z-index:6;inset:auto 14px 18px 14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.steer,.pedals{display:flex;gap:12px;pointer-events:auto}
.btn{width:70px;height:70px;border-radius:20px;border:2px solid #f0b72f;background:rgba(8,14,21,.88);color:#ffd34b;font-size:30px;font-weight:900;box-shadow:0 6px 20px #0009;display:grid;place-items:center;user-select:none;touch-action:none}
.btn:active{transform:scale(.94);background:#28323b}
.pedals{flex-direction:column}.gas{height:100px}.brake{height:65px;color:#ddd}
.hint{position:fixed;z-index:5;bottom:8px;left:50%;transform:translateX(-50%);background:#0009;border-radius:12px;padding:6px 12px;font-size:11px;white-space:nowrap}
.badge{position:fixed;z-index:5;top:82px;left:50%;transform:translateX(-50%);background:#0b1722e8;border:1px solid #3fd58a;border-radius:20px;padding:8px 14px;display:none}
@media(max-width:700px){
 .hud{top:6px}.player{min-width:130px}.order{min-width:150px}.player .small{display:none}
 .panel{padding:7px 9px}.title{font-size:14px}.money{font-size:13px}.order{font-size:12px}.speed{min-width:78px}.speed b{font-size:20px}
 .btn{width:62px;height:62px}.gas{height:88px}.brake{height:58px}.hint{font-size:9px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="panel player"><div class="title">🏍️ Abod <span class="small">LV 5</span></div><div class="money">💵 <span id="money">12,450</span> ج</div></div>
  <div class="panel order"><b>📦 الطلب الحالي</b><div id="orderText">اتجه إلى مطعم البركة</div><div class="small" id="timer">الوقت: 03:45</div></div>
  <div class="panel speed"><div>السرعة</div><b><span id="speed">0</span></b> <span>KM/H</span></div>
</div>

<div id="badge" class="badge">📦 تم استلام الطلب — اتجه إلى نقطة التسليم</div>

<div class="controls">
  <div class="steer">
    <div class="btn" id="right">▶</div>
    <div class="btn" id="left">◀</div>
  </div>
  <div class="pedals">
    <div class="btn gas" id="gas">▲</div>
    <div class="btn brake" id="brake">▼</div>
  </div>
</div>
<div class="hint">كمبيوتر: W/S للحركة • A/D للتوجيه — موبايل: الأزرار أسفل الشاشة</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const mapImg=new Image(); mapImg.src='city-map.png';

let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

const keys={up:false,down:false,left:false,right:false};
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(k==='w'||k==='arrowup')keys.up=true;
 if(k==='s'||k==='arrowdown')keys.down=true;
 if(k==='a'||k==='arrowleft')keys.left=true;
 if(k==='d'||k==='arrowright')keys.right=true;
});
addEventListener('keyup',e=>{
 const k=e.key.toLowerCase();
 if(k==='w'||k==='arrowup')keys.up=false;
 if(k==='s'||k==='arrowdown')keys.down=false;
 if(k==='a'||k==='arrowleft')keys.left=false;
 if(k==='d'||k==='arrowright')keys.right=false;
});
function bind(id,key){
 const el=document.getElementById(id);
 ['pointerdown'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();keys[key]=true}));
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();keys[key]=false}));
}
bind('gas','up');bind('brake','down');bind('left','left');bind('right','right');

const player={x:838,y:515,a:0,v:0,w:28,h:52};
const traffic=[];
const colors=['#d72e2e','#1672c9','#e7ad18','#e8e8e8','#1f9b66','#59636d','#bd3c8e'];
for(let i=0;i<18;i++){
  traffic.push({
    x:80+(i*173)%1500,y:260+(i%5)*92,
    a:(i%2?0:Math.PI),v:0.7+Math.random()*1.0,
    c:colors[i%colors.length],lane:i%5
  });
}
let money=12450, delivered=false, picked=false, elapsed=0;

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function drawVehicle(x,y,a,c,isPlayer=false){
 ctx.save();ctx.translate(x,y);ctx.rotate(a);
 // shadow
 ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,5,isPlayer?17:15,isPlayer?29:25,0,0,Math.PI*2);ctx.fill();
 // body
 ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(-isPlayer?9:-8,-isPlayer?25:-22,isPlayer?18:16,isPlayer?50:44,6);ctx.fill();
 ctx.fillStyle='#17202a';ctx.beginPath();ctx.roundRect(-6,-14,12,12,3);ctx.fill();
 ctx.fillStyle='#bfe8ff';ctx.globalAlpha=.9;ctx.beginPath();ctx.roundRect(-5,-11,10,8,2);ctx.fill();
 ctx.globalAlpha=1;
 ctx.fillStyle='#111';ctx.fillRect(-10,-19,4,11);ctx.fillRect(6,-19,4,11);ctx.fillRect(-10,8,4,11);ctx.fillRect(6,8,4,11);
 if(isPlayer){ctx.fillStyle='#f4c62e';ctx.fillRect(-8,-29,16,5);ctx.fillStyle='#222';ctx.fillRect(-4,-22,8,4)}
 ctx.restore();
}

function worldToScreen(x,y){
 return {x:x-camera.x+W/2,y:y-camera.y+H/2}
}
let camera={x:player.x,y:player.y};

function draw(){
 ctx.clearRect(0,0,W,H);
 // Full, uncropped map: scale it to a large playable world.
 const iw=mapImg.width,ih=mapImg.height, scale=1.55;
 const mw=iw*scale,mh=ih*scale;
 const sx=worldToScreen(0,0).x, sy=worldToScreen(0,0).y;
 ctx.drawImage(mapImg,sx,sy,mw,mh);

 // destination marker
 const target=picked?{x:1250,y:350}:{x:850,y:235};
 const tp=worldToScreen(target.x,target.y);
 const pulse=10+Math.sin(performance.now()/180)*4;
 ctx.strokeStyle=picked?'#43e38a':'#36d8ff';ctx.lineWidth=4;
 ctx.beginPath();ctx.arc(tp.x,tp.y,pulse,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle=picked?'#43e38a':'#36d8ff';ctx.beginPath();ctx.arc(tp.x,tp.y,7,0,Math.PI*2);ctx.fill();

 for(const car of traffic){
   const p=worldToScreen(car.x,car.y);drawVehicle(p.x,p.y,car.a,car.c,false);
 }
 const pp=worldToScreen(player.x,player.y);drawVehicle(pp.x,pp.y,player.a,'#f4a800',true);

 // mini route arrow
 const dx=target.x-player.x,dy=target.y-player.y,dist=Math.hypot(dx,dy);
 if(dist<90){
   if(!picked){picked=true;document.getElementById('orderText').textContent='اتجه إلى شارع الجامعة';showBadge('📦 تم استلام الطلب — اتجه إلى نقطة التسليم')}
   else if(dist<55 && !delivered){delivered=true;money+=18500;document.getElementById('money').textContent=money.toLocaleString('en-US');document.getElementById('orderText').textContent='تم التسليم بنجاح! +18,500 ج';showBadge('💰 تم تسليم الطلب — مكافأة 18,500 ج')}
 }
}

function showBadge(t){const b=document.getElementById('badge');b.textContent=t;b.style.display='block';clearTimeout(showBadge.t);showBadge.t=setTimeout(()=>b.style.display='none',2600)}

let last=performance.now();
function loop(now){
 const dt=Math.min((now-last)/16.67,2);last=now;
 const accel=keys.up?.20:keys.down?-28:0;
 player.v+=accel*dt;
 if(!keys.up&&!keys.down)player.v*=Math.pow(.91,dt);
 player.v=clamp(player.v,-55,120);
 const steer=(keys.right?1:0)-(keys.left?1:0);
 player.a+=steer*(0.032+Math.abs(player.v)/420)*dt*(player.v>=0?1:-1);
 player.x+=Math.sin(player.a)*player.v*dt;
 player.y-=Math.cos(player.a)*player.v*dt;
 // world bounds
 player.x=clamp(player.x,30,2350);player.y=clamp(player.y,30,1450);
 for(const car of traffic){
   car.x+=Math.sin(car.a)*car.v*dt;
   car.y-=Math.cos(car.a)*car.v*dt;
   if(car.x<-50)car.x=2350;if(car.x>2400)car.x=-20;
   if(car.y<-50)car.y=1450;if(car.y>1500)car.y=-20;
   const d=Math.hypot(car.x-player.x,car.y-player.y);
   if(d<35){player.v*=.55; car.v*=.9}
 }
 camera.x += (player.x-camera.x)*.10*dt;
 camera.y += (player.y-camera.y)*.10*dt;
 document.getElementById('speed').textContent=Math.round(Math.abs(player.v)*.72);
 elapsed+=dt/60;
 if(!delivered){
   const remain=Math.max(0,225-elapsed);
   const m=Math.floor(remain/60),s=Math.floor(remain%60);
   document.getElementById('timer').textContent=`الوقت: ${m}:${String(s).padStart(2,'0')}`;
 }
 draw();requestAnimationFrame(loop);
}
mapImg.onload=()=>requestAnimationFrame(loop);
</script>
</body>
</html>
